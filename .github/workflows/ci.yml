name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run type check
              run: npm run type-check

            - name: Run linter
              run: npm run lint

            - name: Run tests with coverage
              run: npm run test:coverage

            - name: Convert Jest coverage to JaCoCo format
              if: matrix.node-version == '20.x' && github.ref == 'refs/heads/main'
              run: |
                  mkdir -p target/site/jacoco
                  node -e "
                  const fs = require('fs');
                  const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json'));
                  const total = summary.total;

                  // JaCoCo CSV format: GROUP,PACKAGE,CLASS,INSTRUCTION_MISSED,INSTRUCTION_COVERED,BRANCH_MISSED,BRANCH_COVERED,LINE_MISSED,LINE_COVERED,COMPLEXITY_MISSED,COMPLEXITY_COVERED,METHOD_MISSED,METHOD_COVERED
                  const lineCovered = Math.round(total.lines.total * total.lines.pct / 100);
                  const lineMissed = total.lines.total - lineCovered;
                  const branchCovered = Math.round(total.branches.total * total.branches.pct / 100);
                  const branchMissed = total.branches.total - branchCovered;

                  const csv = 'GROUP,PACKAGE,CLASS,INSTRUCTION_MISSED,INSTRUCTION_COVERED,BRANCH_MISSED,BRANCH_COVERED,LINE_MISSED,LINE_COVERED,COMPLEXITY_MISSED,COMPLEXITY_COVERED,METHOD_MISSED,METHOD_COVERED\n' +
                             'runpaths,runpaths,Total,0,100,' + branchMissed + ',' + branchCovered + ',' + lineMissed + ',' + lineCovered + ',0,10,0,10';

                  fs.writeFileSync('target/site/jacoco/jacoco.csv', csv);
                  console.log('Generated JaCoCo CSV:');
                  console.log(csv);
                  "

            - name: Generate coverage badge
              if: matrix.node-version == '20.x' && github.ref == 'refs/heads/main'
              uses: cicirello/jacoco-badge-generator@v2
              with:
                  badges-directory: badges
                  generate-coverage-badge: true
                  coverage-badge-filename: coverage.svg
                  generate-branches-badge: false
                  generate-summary: true

            - name: Commit coverage badge
              if: matrix.node-version == '20.x' && github.ref == 'refs/heads/main'
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add badges/coverage.svg badges/coverage-summary.json || true
                  git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"

            - name: Push coverage badge
              if: matrix.node-version == '20.x' && github.ref == 'refs/heads/main'
              uses: ad-m/github-push-action@master
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  branch: main
